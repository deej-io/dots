# start pane and window numbers from 1
set -g base-index 1
setw -g pane-base-index 1

# bigger history
set -g history-limit 50000

# Vim keybindings in scroll view
set-window-option -g mode-keys vi

set -g extended-keys on
set -g extended-keys-format csi-u

# tmux-intray: quiet inbox for pane/window notifications
run-shell ~/.local/share/tmux-plugins/tmux-intray/tmux-intray.tmux
bind-key J run-shell "tmux popup -E -h 50% -w 70% 'tmux-intray tui'"
set -g status-right "#(tmux-intray status --format='📨 {{unread-count}}/{{total-count}}') %H:%M %a %d-%b-%y"
